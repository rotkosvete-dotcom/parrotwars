name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Take wrapper and build.gradle from official Forge MDK
        shell: bash
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.16.5-36.2.34/forge-1.16.5-36.2.34-mdk.zip
          unzip -q mdk.zip -d mdk
          rm -rf gradle
          cp -r mdk/gradle gradle
          cp mdk/gradlew mdk/gradlew.bat .
          chmod +x gradlew
          cp mdk/build.gradle build.gradle
          sed -i "s/examplemod/parrotwars/g; s/com\.yourname\.modid/com.parrotwars/g; s/'modid'/'parrotwars-1.16.5'/g; s/mappings channel: '[a-z]*', version: '[^']*'/mappings channel: 'official', version: '1.16.5'/" build.gradle
          grep -nE "mappings|archivesBase|group|version =" build.gradle
      - name: Build
        shell: bash
        run: ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log
      - name: Report error text
        if: failure()
        shell: bash
        run: |
          m=$(tail -n 45 build.log | cut -c1-220)
          m="${m//'%'/'%25'}"
          m="${m//$'\n'/'%0A'}"
          m="${m//$'\r'/'%0D'}"
          echo "::error title=BUILDLOG::${m:0:3500}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parrotwars-jar
          path: |
            build/libs/*.jar
            build.log
