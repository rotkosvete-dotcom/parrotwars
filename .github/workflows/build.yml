name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Put flat-uploaded files into src folders
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, shutil, glob
          R = 'src/main/resources'
          A = R + '/assets/parrotwars'
          D = R + '/data/parrotwars'
          def put(src, dst):
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copyfile(src, dst)
              print(src, '->', dst)
          for f in sorted(glob.glob('*')):
              if not os.path.isfile(f):
                  continue
              base = re.sub(r' \(\d+\)', '', f)
              if f.endswith('.java'):
                  pkg = re.search(r'^package\s+([\w.]+);', open(f, encoding='utf8').read(), re.M).group(1)
                  put(f, 'src/main/java/' + pkg.replace('.', '/') + '/' + f)
              elif f in ('ru_ru.json', 'en_us.json'):
                  put(f, A + '/lang/' + f)
              elif f == 'mods.toml':
                  put(f, R + '/META-INF/mods.toml')
              elif f == 'pack.mcmeta':
                  put(f, R + '/pack.mcmeta')
              elif f.endswith('.png'):
                  put(f, A + '/textures/entity/' + f)
              elif f.endswith('.json'):
                  try:
                      j = json.load(open(f, encoding='utf8'))
                  except Exception:
                      continue
                  p = j.get('parent', '')
                  t = j.get('type', '')
                  if 'variants' in j:
                      put(f, A + '/blockstates/barracks.json')
                  elif t == 'minecraft:block':
                      put(f, D + '/loot_tables/blocks/barracks.json')
                  elif t.startswith('minecraft:crafting_'):
                      res = j['result']['item'] if isinstance(j['result'], dict) else j['result']
                      put(f, D + '/recipes/' + res.split(':')[1] + '.json')
                  elif p == 'minecraft:block/cube_all':
                      put(f, A + '/models/block/barracks.json')
                  elif p == 'parrotwars:block/barracks':
                      put(f, A + '/models/item/barracks.json')
                  elif p == 'item/template_spawn_egg':
                      put(f, A + '/models/item/' + base)
                  elif p in ('item/generated', 'minecraft:item/generated', 'item/handheld'):
                      put(f, A + '/models/item/' + re.sub(r'(_item_model)?\.json$', '', base) + '.json')
          PY
      - name: Take wrapper and build.gradle from official Forge MDK
        shell: bash
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.16.5-36.2.34/forge-1.16.5-36.2.34-mdk.zip
          unzip -q mdk.zip -d mdk
          rm -rf gradle
          cp -r mdk/gradle gradle
          cp mdk/gradlew mdk/gradlew.bat .
          chmod +x gradlew
          cp mdk/build.gradle build.gradle
          sed -i "s/examplemod/parrotwars/g; s/com\.yourname\.modid/com.parrotwars/g; s/'modid'/'parrotwars-1.16.5'/g; s/mappings channel: '[a-z]*', version: '[^']*'/mappings channel: 'official', version: '1.16.5'/" build.gradle
      - name: Build
        shell: bash
        run: ./gradlew build --console=plain 2>&1 | tee build.log
      - name: Report error text
        if: failure()
        shell: bash
        run: |
          grep -A2 -E "error:" build.log | cut -c1-210 | grep -v "^--$" | sed 's#/home/runner/work/[^/]*/[^/]*/src/main/java/com/parrotwars/##' > errors.txt || true
          if [ ! -s errors.txt ]; then grep -A8 -E "What went wrong" build.log | cut -c1-210 > errors.txt || true; fi
          m=$(head -c 3400 errors.txt)
          m="${m//'%'/'%25'}"
          m="${m//$'\n'/'%0A'}"
          m="${m//$'\r'/'%0D'}"
          echo "::error title=BUILDLOG::${m}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parrotwars-jar
          path: |
            build/libs/*.jar
            build.log
