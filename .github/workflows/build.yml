name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Get Gradle wrapper from official Forge MDK
        shell: bash
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.16.5-36.2.34/forge-1.16.5-36.2.34-mdk.zip
          unzip -q mdk.zip -d mdk
          rm -rf gradle
          cp -r mdk/gradle gradle
          cp mdk/gradlew mdk/gradlew.bat .
          chmod +x gradlew
      - name: Build
        shell: bash
        run: ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log
      - name: Show log in summary
        if: always()
        shell: bash
        run: |
          echo '## build.log (last 120 lines)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parrotwars-jar
          path: |
            build/libs/*.jar
            build.log
